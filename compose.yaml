services:
  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: slate_dev
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: slate
    ports:
      - "${SLATE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - slate-postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slate -d slate_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: slate_dev
      MYSQL_USER: slate
      MYSQL_PASSWORD: slate
      MYSQL_ROOT_PASSWORD: slate
    ports:
      - "${SLATE_MYSQL_PORT:-53306}:3306"
    volumes:
      - slate-mysql-data:/var/lib/mysql
      - ./dev/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pslate"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  slate-postgres-data:
  slate-mysql-data:
